<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#141e1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232f9c86'/%3E%3C/svg%3E" />
  <title>Hand Melody · 手势唱音</title>
  <style>
    :root {
      --bg: #141e1d; --card: #1c2928; --input: #243534; --border: #2b3b39;
      --accent: #2f9c86; --accent-h: #4bad97; --text: #dcece8; --sub: #a4b5b0; --dim: #6f817c;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
    #stage { position: fixed; inset: 0; touch-action: none; z-index: 1; }
    #view { width: 100%; height: 100%; display: block; }
    /* iOS Safari 会对不可见/极小的 video 停止解码，所以让它铺满并压在不透明画布下面 */
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
    #hud, #hint, #gearBtn, #panel { z-index: 2; }

    #hud { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    #note { font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: 1px; }
    #note small { font-size: 18px; color: var(--sub); margin-left: 6px; font-weight: 400; }
    #noteSub { font-size: 13px; color: var(--sub); margin-top: 6px; }
    #stats { font: 11px/1.5 ui-monospace, Consolas, monospace; color: var(--dim); text-align: right; white-space: pre; }

    #gearBtn { position: fixed; right: 14px; bottom: calc(env(safe-area-inset-bottom) + 14px);
      height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--card); color: var(--sub); font-size: 13px; }
    #hint { position: fixed; left: 14px; bottom: calc(env(safe-area-inset-bottom) + 16px); right: 100px; line-height: 1.7;
      font-size: 12px; color: var(--dim); pointer-events: none; }

    #panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 75%; overflow-y: auto;
      background: var(--card); border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
      padding: 14px 18px calc(env(safe-area-inset-bottom) + 18px); transform: translateY(105%);
      transition: transform .22s ease; max-width: 560px; margin: 0 auto; }
    #panel.open { transform: none; }
    #panel h3 { margin: 0 0 6px; font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
    #panel h3 button { background: var(--input); border: 1px solid var(--border); color: var(--sub); font-size: 12px; border-radius: 8px; padding: 5px 12px; }
    .sec { font-size: 12px; color: var(--dim); margin: 14px 0 2px; }
    .row { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; color: var(--sub); }
    .row label { width: 84px; flex: none; }
    .row select, .row input[type=range] { flex: 1; min-width: 0; }
    .row .val { width: 58px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-size: 12px; }
    select { background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 8px; font-size: 13px; }
    input[type=range] { accent-color: var(--accent); }
    input[type=checkbox] { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }

    #intro { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 28px; text-align: center; z-index: 5; }
    #intro h1 { font-size: 22px; font-weight: 500; margin: 0 0 6px; }
    #intro p { color: var(--sub); font-size: 13px; line-height: 1.8; margin: 4px 0; max-width: 360px; }
    #intro .how { text-align: left; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 16px; margin: 18px 0; }
    #intro .how div { font-size: 13px; color: var(--sub); line-height: 2; }
    #intro .how b { color: var(--text); font-weight: 500; display: inline-block; width: 92px; }
    #startBtn { background: var(--accent); color: #0f1716; border: none; border-radius: 10px;
      padding: 13px 34px; font-size: 15px; font-weight: 500; }
    #startBtn:active { background: var(--accent-h); }
    #startBtn:disabled { opacity: .5; }
    #status { margin-top: 14px; font-size: 12px; color: var(--dim); min-height: 18px; max-width: 360px; line-height: 1.6; }
    #status.err { color: #d98c7a; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="view"></canvas></div>
  <video id="cam" playsinline muted autoplay></video>

  <div id="hud">
    <div>
      <div id="note">--<small></small></div>
      <div id="noteSub">举起手掌开始唱</div>
    </div>
    <div id="stats"></div>
  </div>
  <div id="hint">右手：上下=音高 · 张开唱/握拳停<br />左手：高度=音量 · 1啊 2喔 3呜 4诶 5咿</div>
  <button id="gearBtn">设置</button>

  <div id="panel">
    <h3>设置 <button id="closePanel">完成</button></h3>

    <div class="sec">声音</div>
    <div class="row"><label>音色</label><select id="s_timbre"></select></div>
    <div class="row"><label>声部</label><select id="s_voice"></select></div>
    <div class="row"><label>合唱叠声</label><input type="checkbox" id="s_choir" /></div>
    <div class="row"><label>元音</label><select id="s_vowelMode">
      <option value="fingers">左手手指数（1啊 2喔 3呜 4诶 5咿）</option>
      <option value="fixed">固定“啊”</option>
      <option value="x">右手左右移动 u·o·a·e·i</option>
    </select></div>
    <div class="row"><label>颤音</label><input type="range" id="s_vibrato" min="0" max="40" step="1" /><span class="val" id="v_vibrato"></span></div>
    <div class="row"><label>音量</label><input type="range" id="s_volume" min="0" max="1" step="0.01" /><span class="val" id="v_volume"></span></div>

    <div class="sec">音高</div>
    <div class="row"><label>音阶</label><select id="s_scale"></select></div>
    <div class="row"><label>调</label><select id="s_key"></select></div>
    <div class="row"><label>最低音</label><input type="range" id="s_low" min="36" max="72" step="1" /><span class="val" id="v_low"></span></div>
    <div class="row"><label>音域</label><input type="range" id="s_span" min="7" max="30" step="1" /><span class="val" id="v_span"></span></div>
    <div class="row"><label>吸附强度</label><input type="range" id="s_snap" min="0" max="1" step="0.05" /><span class="val" id="v_snap"></span></div>
    <div class="row"><label>滑音时间</label><input type="range" id="s_glide" min="5" max="150" step="5" /><span class="val" id="v_glide"></span></div>

    <div class="sec">手势</div>
    <div class="row"><label>发声方式</label><select id="s_gateMode">
      <option value="open">张开唱 / 握拳停</option>
      <option value="always">看到手就唱</option>
    </select></div>
    <div class="row"><label>握拳阈值</label><input type="range" id="s_gateTh" min="1.0" max="1.8" step="0.02" /><span class="val" id="v_gateTh"></span></div>
    <div class="row"><label>第二只手</label><select id="s_second">
      <option value="volume">高度控制音量</option>
      <option value="off">忽略</option>
    </select></div>
    <div class="row"><label>音高手</label><select id="s_mainHand">
      <option value="right">画面右侧的手</option>
      <option value="left">画面左侧的手</option>
    </select></div>
    <div class="row"><label>跟手度</label><input type="range" id="s_follow" min="0.3" max="6" step="0.1" /><span class="val" id="v_follow"></span></div>
    <div class="row"><label>上边距</label><input type="range" id="s_top" min="0" max="0.4" step="0.01" /><span class="val" id="v_top"></span></div>
    <div class="row"><label>下边距</label><input type="range" id="s_bottom" min="0" max="0.4" step="0.01" /><span class="val" id="v_bottom"></span></div>
    <div class="row"><label>显示摄像头</label><input type="range" id="s_camAlpha" min="0" max="1" step="0.05" /><span class="val" id="v_camAlpha"></span></div>
    <div class="row"><label>调试信息</label><input type="checkbox" id="s_debug" /></div>
  </div>

  <div id="intro">
    <h1>Hand Melody · 手势唱音</h1>
    <p>用手的高度控制音高，让虚拟人声唱出“啊——”</p>
    <div class="how">
      <div><b>手掌上下</b>音高高低（自动吸附到音阶）</div>
      <div><b>张开手掌</b>开始唱</div>
      <div><b>握拳</b>停止</div>
      <div><b>左手高度</b>抬高更响，放低更轻</div>
      <div><b>左手手指数</b>1 啊 · 2 喔 · 3 呜 · 4 诶 · 5 咿</div>
      <div><b>换音色</b>设置里可选 哼鸣 / 口哨 / 机器人</div>
      <div><b>没有摄像头</b>手指在屏幕上按住拖动也能唱</div>
    </div>
    <p>手机竖屏放在支架上，人离开 50~80cm，光线充足效果最好</p>
    <button id="startBtn">开始</button>
    <div id="status"></div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
